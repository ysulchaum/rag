[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ysulchaum", email = "ysulchaum@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2.13",
    "langchain-postgres>=0.0.14",
    "langchain-ollama>=0.3.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "ruff>=0.16.10",
    "typesafe-ai>=0.1.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
